<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборды проектов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    background: #F4F6F4; color: #1A1D1A;
    min-height: 100vh;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14171A; color: #E8EBE8; }
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 24px 64px; }
  header h1 {
    font: 600 28px/1.2 "Literata", Georgia, serif;
    margin: 0 0 6px;
  }
  header p { margin: 0 0 32px; opacity: .65; }
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: 1fr;
  }
  .card {
    display: flex; align-items: center; gap: 22px;
    text-decoration: none; color: inherit;
    background: #FFFFFF; border: 1px solid rgba(26,29,26,.12);
    border-radius: 12px; padding: 20px 22px;
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .card:hover {
    border-color: #3D6B4F; transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(26,29,26,.08);
  }
  @media (prefers-color-scheme: dark) {
    .card { background: #1C2126; border-color: rgba(232,235,232,.14); }
    .card:hover { border-color: #7FB89A; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  }
  .card img {
    display: block; width: 40%; max-width: 400px; min-width: 260px; flex-shrink: 0; height: auto;
    aspect-ratio: 16 / 9; object-fit: cover;
    border-radius: 8px;
    border: 1px solid rgba(26,29,26,.10);
  }
  @media (prefers-color-scheme: dark) {
    .card img { border-color: rgba(232,235,232,.12); }
  }
  .card h2 { font: 600 17px/1.3 "IBM Plex Sans", sans-serif; margin: 0 0 8px; color: inherit; }
  .card p { margin: 0 0 14px; font-size: 14px; opacity: .7; }
  .card .go { font: 500 13px/1 "IBM Plex Mono", monospace; color: #2E7D54; }
  @media (prefers-color-scheme: dark) { .card .go { color: #7FB89A; } }
  @media (max-width: 640px) {
    .card { flex-direction: column; align-items: stretch; }
    .card img { width: 100%; max-width: none; min-width: 0; }
  }
  footer { margin-top: 40px; font-size: 12.5px; opacity: .5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Дашборды проектов</h1>
    <p>Публичные статус-дашборды. Каждый обновляется автоматически из своего приватного репозитория.</p>
  </header>
  <main class="grid">
    <a class="card" href="probka-legal-agent-status/">
      <img src="assets/probka-legal-agent-status.webp" alt="AM Legal Agent — робот-юрист за работой" width="800" height="450" loading="lazy" decoding="async">
      <div class="body">
        <h2>AM Legal Agent — доска задач</h2>
        <p>Рабочая доска задач и статусов проекта.</p>
        <span class="go">probka-legal-agent-status →</span>
      </div>
    </a>
  </main>
  <footer>Обновляется автоматически · GitHub Pages</footer>
</div>
</body>
</html>
